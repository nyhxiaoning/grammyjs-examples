<!DOCTYPE html>
<html>
    <head>
        <title>加法器</title>
        <script src="https://telegram.org/js/telegram-web-app.js"></script>
    </head>
    <body>
        <input id="first" placeholder="第一个数字" />
        <input id="second" placeholder="第二个数字" />
        <button onclick="send()">计算</button>

        <script>
            // 确保 Telegram Web App 已加载
            if (typeof window.Telegram === 'undefined') {
                alert('请在 Telegram 中打开此页面')
                return
            }

            const tg = window.Telegram.WebApp
            tg.expand() // 可选，让 Web App 更高，全屏

            function send() {
                const first = parseInt(
                    document.getElementById('first').value,
                    10
                )
                const second = parseInt(
                    document.getElementById('second').value,
                    10
                )

                const data = JSON.stringify({ first, second })

                // 发送给 Telegram Bot
                tg.sendData(data) // <-- 关键步骤
                tg.close() // 关闭 Web App
            }
        </script>
    </body>
</html>
